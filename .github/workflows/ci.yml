name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-algo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-algo-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-algo-web
    env:
      NEXT_PUBLIC_API_URL: https://my-algo-backend.haruki1009kk.workers.dev
      NEXT_PUBLIC_WS_URL: wss://my-algo-backend.haruki1009kk.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-algo-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
